services:
  - type: web
    name: cerro-tusa-experience
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: MONGODB_DATABASE
        value: cerro_tusa_turismo
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: BUSINESS_NAME
        value: Cerro Tusa Experience
